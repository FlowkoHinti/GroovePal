dataset:
  dna_path: Data/fine_tuning          # Folder containing subfolders: train/, val/, test/
  #subset: 1000                         # (Optional) Load only the first N samples
  shuffle: true                        # Shuffle the dataset in the DataLoader
  num_workers: 4                       # Data loading parallelism
  persistent_workers: true            # workers persist over epochs
  prefetch_factor: 2                  # how many batches to prefetch
  pin_memory: true                    # allocate batches in page-locked (“pinned”) memory
  drop_last: true                     # drop last smaller batch

  tokenizer:
    trim_leading_empty_measures: true
    absolute_grid_units: false

embedding:
  instruments:
    embedding_dim: 4
  velocities:
    embedding_dim: 12
  offsets:
    embedding_dim: 12
  time_signature:
    embedding_dim: 4
  grid_factor:
    embedding_dim: 4
  bpm:
    embedding_dim: 8
  beat_units:
    embedding_dim: 8
    absolute_beat_units: false
  normalize_embeddings: false

model:
  context_length: ... # inject at runtime
  embedding_dim: ... # inject at runtime
  dropout: 0.1
  num_blocks: 14
  add_embedding_dropout: true

  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 4 # 4/8 are a rule of thumb amount that seemed to work best for most nlp tasks

  slstm_block:
    slstm:
      num_heads: 4
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu

  slstm_at: [7, 13]

train:
  model_name: finetuned_multitask_small
  loss: manual
  manual_weights: {
    "instrument": 0.15,
    "velocity": 0.25,
    "offset": 0.25,
    "beat_unit": 0.2,
    "grid_factor": 0.05,
    "bpm": 0.05,
    "time_signature": 0.05
  }
  save_dir: Models
  device: cuda
  batch_size: 32
  epochs: 20

  initial_lr: 0.00005
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  use_mixed_precision: true
  monitor: val_loss
  mode: min
  patience: 4
  load_best_on_start: false
  metrics: ['accuracy', 'perplexity', 'mse', 'mae']

  lr_scheduler:
    type: linear_warmup_cosine_annealing # lr_step
    #lr_step_size: 10
    #lr_gamma: 0.5

    lr_warmup_steps_ratio: 0.05
    lr_decay_factor: 0.001


  finetune:
    enabled: true
    init_from: multitask_small
    start_epoch: 3                       # epoch index to start gradual unfreeze
    unfreeze_per_epoch: 1                # how many layer-groups to unfreeze each epoch
    strict_loading: false                # set true if you expect exact key matching