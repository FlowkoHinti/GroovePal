dataset:
  dna_path: /path/to/dna/data
  train_split: train.txt
  val_split: val.txt
  convert_to_tensor: true
  shuffle: true
  num_workers: 4

embedding:
  instruments:
    embedding_dim: 4
  velocities:
    embedding_dim: 22
  offsets:
    embedding_dim: 16
  time_signature:
    embedding_dim: 8
  grid_factor:
    embedding_dim: 4
  bpm:
    embedding_dim: 16
  beat_units:
    embedding_dim: 26
    absolute_beat_units: false

model:
  context_length: 512
  embedding_dim: 128
  dropout: 0.1
  num_blocks: 7
  add_embedding_dropout: true

  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 4

  slstm_block:
    slstm:
      backend: auto   # or "cuda", "vanilla"
      num_heads: 4
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu

  slstm_at: [1]

train:
  model_name: multitask_dna_lstm
  save_dir: ./runs
  batch_size: 32
  epochs: 50
  initial_lr: 0.001
  use_scheduler: true
  lr_step_size: 10
  lr_gamma: 0.5
  gradient_clip_norm: 1.0
  precision: mixed
  device: cuda
  monitor: val_loss
  mode: min
  patience: 5
  seed: 42
  resume: false
