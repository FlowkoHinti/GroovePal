dataset:
  dna_path: Data/pre_training          # Folder containing subfolders: train/, val/, test/
  convert_to_tensor: true              # Convert token sequences to tensors
  subset: 1000                         # (Optional) Load only the first N samples
  shuffle: true                        # Shuffle the dataset in the DataLoader
  num_workers: 4                       # Data loading parallelism

  tokenizer:
    trim_leading_empty_measures: true
    absolute_grid_units: false

embedding:
  instruments:
    embedding_dim: 4
  velocities:
    embedding_dim: 16
  offsets:
    embedding_dim: 16
  time_signature:
    embedding_dim: 8
  grid_factor:
    embedding_dim: 4
  bpm:
    embedding_dim: 16
  beat_units:
    embedding_dim: 16
    absolute_beat_units: false
  normalize_embeddings: false

model:
  context_length: ... # inject at runtime
  embedding_dim: ... # inject at runtime
  dropout: 0.1
  num_blocks: 14
  add_embedding_dropout: true

  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 4 # 4/8 are a rule of thumb amount that seemed to work best for most nlp tasks

  slstm_block:
    slstm:
      num_heads: 4
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu

  slstm_at: [0, 7]

train:
  model_name: mt_relgu_nopos
  save_dir: Models
  device: cuda
  batch_size: 32
  epochs: 20
  initial_lr: 0.001
  use_scheduler: true
  lr_step_size: 10
  lr_gamma: 0.5
  gradient_clip_norm: 1.0
  precision: mixed
  monitor: val_loss
  mode: min
  patience: 5
  load_best: false
  metrics: ['top_k_accuracy@1','top_k_accuracy@3', 'top_k_f1@3', 'top_k_precision@3', 'top_k_recall@3','perplexity']
